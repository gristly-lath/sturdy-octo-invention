<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101827">
  <title>Simple Calculator</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #101827;
      color: #f8fafc;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 1.25rem;
      background: radial-gradient(ellipse at top, #24334d 0, #101827 62%);
    }

    .calculator {
      width: min(100%, 360px);
      padding: 1.25rem;
      border: 1px solid #334155;
      border-radius: 1.5rem;
      background: #172235;
      box-shadow: 0 24px 70px #0007;
    }

    h1 {
      margin: 0 0 1rem;
      color: #cbd5e1;
      font-size: .9rem;
      font-weight: 600;
      letter-spacing: .12em;
      text-align: center;
      text-transform: uppercase;
    }

    .display {
      min-height: 104px;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      overflow: hidden;
      margin-bottom: 1rem;
      padding: 1rem;
      border-radius: 1rem;
      background: #0b1220;
      text-align: right;
    }

    .previous {
      min-height: 1.5rem;
      overflow: hidden;
      color: #94a3b8;
      font-size: .95rem;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .current {
      overflow: hidden;
      font-size: clamp(2rem, 12vw, 3rem);
      font-variant-numeric: tabular-nums;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .keys {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: .65rem;
    }

    button {
      min-height: 58px;
      border: 0;
      border-radius: .9rem;
      background: #26354b;
      color: #f8fafc;
      cursor: pointer;
      font: inherit;
      font-size: 1.2rem;
      transition: background .15s, transform .08s;
      touch-action: manipulation;
    }

    button:hover { background: #354760; }
    button:active { transform: scale(.96); }
    button:focus-visible { outline: 3px solid #7dd3fc; outline-offset: 2px; }
    button.utility { background: #3b4b62; color: #e2e8f0; }
    button.operator { background: #075985; }
    button.operator:hover { background: #0369a1; }
    button.equals { grid-row: span 2; background: #0e7490; }
    button.equals:hover { background: #0891b2; }
    button.zero { grid-column: span 2; }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <main class="calculator" aria-label="Calculator">
    <h1>Calculator</h1>
    <section class="display" aria-live="polite" aria-atomic="true" aria-label="Result">
      <div class="previous" id="previous"></div>
      <output class="current" id="current">0</output>
    </section>
    <div class="keys" aria-label="Calculator keys">
      <button class="utility" data-action="clear" aria-label="Clear all">AC</button>
      <button class="utility" data-action="delete" aria-label="Delete last digit">DEL</button>
      <button class="utility" data-action="sign" aria-label="Change sign">±</button>
      <button class="operator" data-operator="÷" aria-label="Divide">÷</button>

      <button data-digit="7">7</button>
      <button data-digit="8">8</button>
      <button data-digit="9">9</button>
      <button class="operator" data-operator="×" aria-label="Multiply">×</button>

      <button data-digit="4">4</button>
      <button data-digit="5">5</button>
      <button data-digit="6">6</button>
      <button class="operator" data-operator="−" aria-label="Subtract">−</button>

      <button data-digit="1">1</button>
      <button data-digit="2">2</button>
      <button data-digit="3">3</button>
      <button class="operator" data-operator="+" aria-label="Add">+</button>

      <button class="zero" data-digit="0">0</button>
      <button data-action="decimal" aria-label="Decimal point">.</button>
      <button class="equals" data-action="equals" aria-label="Equals">=</button>
    </div>
  </main>

  <script>
    const currentDisplay = document.querySelector('#current');
    const previousDisplay = document.querySelector('#previous');
    let currentValue = '0';
    let storedValue = null;
    let operator = null;
    let replaceCurrent = false;

    function updateDisplay() {
      currentDisplay.textContent = currentValue;
      previousDisplay.textContent = storedValue !== null && operator
        ? `${storedValue} ${operator}`
        : '';
    }

    function enterDigit(digit) {
      if (currentValue === 'Error' || replaceCurrent) {
        currentValue = digit;
        replaceCurrent = false;
      } else if (currentValue === '0') {
        currentValue = digit;
      } else if (currentValue.length < 14) {
        currentValue += digit;
      }
      updateDisplay();
    }

    function enterDecimal() {
      if (currentValue === 'Error' || replaceCurrent) {
        currentValue = '0.';
        replaceCurrent = false;
      } else if (!currentValue.includes('.')) {
        currentValue += '.';
      }
      updateDisplay();
    }

    function calculate() {
      const left = Number(storedValue);
      const right = Number(currentValue);
      let result;

      switch (operator) {
        case '+': result = left + right; break;
        case '−': result = left - right; break;
        case '×': result = left * right; break;
        case '÷':
          if (right === 0) return null;
          result = left / right;
          break;
        default: return right;
      }

      return Number.isFinite(result) ? Number(result.toPrecision(10)) : null;
    }

    function chooseOperator(nextOperator) {
      if (currentValue === 'Error') return;
      if (operator && !replaceCurrent) {
        const result = calculate();
        if (result === null) {
          currentValue = 'Error';
          storedValue = null;
          operator = null;
          replaceCurrent = true;
          updateDisplay();
          return;
        }
        currentValue = String(result);
      }
      storedValue = currentValue;
      operator = nextOperator;
      replaceCurrent = true;
      updateDisplay();
    }

    function equals() {
      if (!operator || storedValue === null || currentValue === 'Error') return;
      const result = calculate();
      currentValue = result === null ? 'Error' : String(result);
      storedValue = null;
      operator = null;
      replaceCurrent = true;
      updateDisplay();
    }

    function clear() {
      currentValue = '0';
      storedValue = null;
      operator = null;
      replaceCurrent = false;
      updateDisplay();
    }

    function handleAction(action) {
      if (action === 'clear') clear();
      if (action === 'delete' && currentValue !== 'Error' && !replaceCurrent) {
        currentValue = currentValue.length > 1 ? currentValue.slice(0, -1) : '0';
        if (currentValue === '-') currentValue = '0';
        updateDisplay();
      }
      if (action === 'sign' && currentValue !== 'Error' && Number(currentValue) !== 0) {
        currentValue = String(Number(currentValue) * -1);
        updateDisplay();
      }
      if (action === 'decimal') enterDecimal();
      if (action === 'equals') equals();
    }

    document.querySelector('.keys').addEventListener('click', (event) => {
      const button = event.target.closest('button');
      if (!button) return;
      if (button.dataset.digit !== undefined) enterDigit(button.dataset.digit);
      if (button.dataset.operator) chooseOperator(button.dataset.operator);
      if (button.dataset.action) handleAction(button.dataset.action);
    });

    document.addEventListener('keydown', (event) => {
      if (/^[0-9]$/.test(event.key)) enterDigit(event.key);
      else if (event.key === '.') enterDecimal();
      else if (event.key === '+') chooseOperator('+');
      else if (event.key === '-') chooseOperator('−');
      else if (event.key === '*') chooseOperator('×');
      else if (event.key === '/') { event.preventDefault(); chooseOperator('÷'); }
      else if (event.key === 'Enter' || event.key === '=') { event.preventDefault(); equals(); }
      else if (event.key === 'Backspace') handleAction('delete');
      else if (event.key === 'Escape') clear();
    });
  </script>
</body>
</html>
